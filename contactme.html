    <title>Contact Me</title>
    <style>
      * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #ffffff;
            color: brown;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background: #fff8f7;
            padding: 20px 40px;
        }

        .navbar ul {
            margin: 0;
            padding: 0;
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .navbar a {
            text-decoration: none;
            color: brown;
            font-size: 18px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #f4a460;
        }
   
        .contact-section {
            max-width: 900px;
            margin: 70px auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            color: brown;
        }

        .contact-grid {
            display: grid;

            /* 2 boxes per row */
            grid-template-columns: repeat(2, 1fr);

            gap: 30px;
        }

        .contact-box {
            min-height: 150px;

            background: #ffffff;

            border: 2px solid #d8b4a0;

            border-radius: 18px;

            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);

            transition: 0.3s;
        }

        .contact-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18);
        }

        .contact-left {
            display: flex;
            align-items: center;
            gap: 15px;

            min-width: 0;
        }

        .icon {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border-radius: 12px;

            display: grid;
            place-items: center;

            font-size: 23px;

            background: linear-gradient(
                180deg,
                #eb5f1e4d,
                #ce4222ee
            );

            border: 1px solid #65060155;
        }
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-name {
            font-size: 19px;
            font-weight: bold;
            color: brown;
        }

        .tagline {
            font-size: 14px;
            color: #777;

            word-break: break-word;
        }
        .contact-link {
            flex-shrink: 0;

            text-decoration: none;

            font-weight: bold;

            color: #ce4222;

            border: 1px solid #b3420555;

            padding: 9px 15px;

            border-radius: 10px;

            background: linear-gradient(
                180deg,
                #f77b559a,
                #ce2d222a
            );

            transition: 0.3s;
        }

        .contact-link:hover {
            border-color: #f4a460;
            color: blue;
        }
        @media (max-width: 680px) {

            .navbar {
                padding: 20px;
            }

            .navbar ul {
                gap: 15px;
                flex-wrap: wrap;
            }

            .navbar a {
                font-size: 15px;
            }

            .contact-section {
                margin: 40px auto;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            .contact-box {
                width: 100%;
            }
        }

footer {

}

footer p {
    margin: 0;

footer span {

    font-weight: bold;
